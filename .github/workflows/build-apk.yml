name: Build APK

# Debug-signed APK build for the fork. Mirrors the house pattern used by
# the other Android forks (termux-x11, Podroid): build on every branch
# push so feature-branch builds produce a sideloadable artifact, plus PRs
# and manual runs.
#
# Output: app-debug APK uploaded as a workflow artifact, downloadable from
# the run's "Artifacts" panel.
#
# Signing: `./gradlew assembleDebug` self-signs using the project's
# initDebugKeystore task (alias `debug`, password `debug0`) when no keystore
# is supplied. To get a STABLE signature across runs — so the APK upgrades
# in place on the Pixel instead of forcing an uninstall — add a repo secret
# named DEBUG_KEYSTORE containing your gpg-armored debug.keystore.asc (see
# CONTRIBUTING.md "Using the local debug.keystore on the Github CI actions").

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # cdict submodule is mandatory — the Gradle build fails fast if
          # vendor/cdict/java is missing.
          submodules: recursive

      # Optional: restore a stable debug keystore from a secret so the APK
      # signature stays constant across runs. No-op if the secret is unset,
      # in which case Gradle's initDebugKeystore generates a throwaway one.
      - name: Restore debug keystore from secret (optional)
        run: |
          if [[ -n "${{ secrets.DEBUG_KEYSTORE }}" ]]; then
            echo "${{ secrets.DEBUG_KEYSTORE }}" > debug.keystore.asc
            gpg -d --passphrase "debug0" --batch debug.keystore.asc > debug.keystore
            echo "Restored stable debug keystore from secret."
          else
            echo "No DEBUG_KEYSTORE secret set; Gradle will generate a debug key."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug
        env:
          DEBUG_KEYSTORE: debug.keystore
          DEBUG_KEYSTORE_PASSWORD: debug0
          DEBUG_KEY_ALIAS: debug
          DEBUG_KEY_PASSWORD: debug0

      - name: Show APK details
        if: always()
        run: |
          ls -la build/outputs/apk/debug/ 2>/dev/null || true
          apk=$(ls build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          if [[ -n "$apk" ]]; then
            echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          fi

      # upload-artifact rejects '/' in names; branch names like feat/foo have
      # one. Replace with '-' and append the short SHA for traceability.
      - name: Compute artifact name
        id: artifact_name
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          echo "name=unexpected-keyboard-${safe_ref}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
